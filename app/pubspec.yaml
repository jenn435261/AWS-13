name: resilience
description: "Resilience Network — local-first, encrypted, disruption-tolerant emergency coordination."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (locked stack)
  flutter_riverpod: ^2.5.1

  # Localization (i18n: English + Spanish + extensible)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Biometric lock for sensitive sections
  local_auth: ^2.3.0

  # Local database (locked stack)
  # drift + sqlite3 are pinned: web/sqlite3.wasm and web/drift_worker.js are the
  # matching release assets (drift-2.35.3 / sqlite3-3.8.0); bump all four together.
  drift: 2.35.3
  sqlite3: 3.8.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Protobuf wire format (locked stack)
  protobuf: ^6.0.0
  fixnum: ^1.1.0

  # Cryptography — Ed25519 signing + X25519 key agreement + hashing (vetted libs)
  cryptography: ^2.7.0
  pinenacl: ^0.6.0
  # Signal Protocol (Double Ratchet, X3DH, Sender-Key groups) — pure Dart
  libsignal_protocol_dart: ^0.8.2

  # Map (locked stack): MapLibre + PMTiles (static, no tile server)
  # maplibre_gl omitted: unused so far and its web plugin breaks `flutter build web`.
  # Re-add behind a conditional import when the real MapLibre view lands.
  pmtiles: ^2.2.0

  # P2P transport: Wi-Fi Direct (Android) / Multipeer (iOS)
  nearby_service: ^0.2.1

  # QR codes for identity + logistics
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Secure messaging attachments (photos + audio). All web-safe:
  #  * image — pure-Dart decode/re-encode + EXIF strip (incl. GPS).
  #  * image_picker — camera/gallery pick (web via <input type=file>).
  #  * record — hold-to-record mic (web via MediaRecorder).
  #  * audioplayers — playback of recorded voice notes (web via <audio>).
  # Verify `flutter build web --release` still compiles after bumping these.
  image: ^4.2.0
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0

  # Networking (cloud transport)
  http: ^1.2.2

  # Browser APIs (web-only online/offline events). Pure interop, web-safe; the
  # native build never imports the web online detector (conditional import).
  web: ^1.1.0

  # Secure storage for private keys (OS keystore / keychain)
  flutter_secure_storage: ^9.2.2

  # Utilities
  collection: ^1.18.0
  uuid: ^4.5.1
  convert: ^3.1.1
  logging: ^1.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.3

  # Device motion sensors for native dead-reckoning (estimated position).
  # Native-only: the web build never imports it (conditional import under
  # lib/location/dead_reckoning/). Verify `flutter build web --release` after
  # bumping this.
  sensors_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  # NOTE: riverpod_generator intentionally omitted. Providers are hand-written
  # (plain Provider/NotifierProvider) to keep codegen fast — build_runner only
  # needs to generate Drift tables, not scan the whole tree for riverpod.

flutter:
  uses-material-design: true
  assets:
    - assets/
