name: mesh_app
description: Minimal cross-platform front end for a LoRa mesh network.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  go_router: ^16.0.0
  http: ^1.5.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Builds lib/l10n/gen from the .arb translation files.
  generate: true
  # Bundled, not downloaded, so text looks the same offline.
  # Plus Jakarta Sans covers Latin and Vietnamese (license: assets/fonts/OFL.txt).
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
