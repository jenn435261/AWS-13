name: mesh_app
description: Minimal cross-platform front end for a LoRa mesh network.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  # Unpacks offline map tiles (gzip or zstd), on phones and on the web.
  archive: ^4.0.9
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  go_router: ^16.0.0
  http: ^1.5.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  # Where the offline street map is kept on the phone.
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  # Pinned: the newest release that works with flutter_map 8 is a beta.
  url_launcher: ^6.3.3
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Builds lib/l10n/gen from the .arb translation files.
  generate: true
  # Bundled, not downloaded, so text looks the same offline.
  # Plus Jakarta Sans covers Latin and Vietnamese (license: assets/fonts/OFL.txt).
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
