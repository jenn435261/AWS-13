<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mesh network console">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mesh">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Mesh</title>
  <!-- Tiny CSS spinner so the page isn't blank while Flutter downloads. -->
  <style>
    html, body { margin: 0; height: 100%; background: #f6faf8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0f1513; } }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; }
    #loading div {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(46, 125, 107, 0.2); border-top-color: #2e7d6b;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading"><div></div></div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        document.getElementById('loading')?.remove();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
